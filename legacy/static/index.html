<!DOCTYPE html>
<!--
  claude-web UI. Vendored libs (pinned, verify with sha256sum):
    static/vendor/marked.umd.js  marked 18.1.3
      sha256 c34a221dc89e91833a88822e7717b8a0cf27118f8c9a8779dffb48a6be31f97a
    static/vendor/purify.min.js  DOMPurify 3.4.17
      sha256 cd37898f9782adf54820c413191b5691803f0f137c799d6edcfd38523b4c2c31
  If the vendor files are missing, app.js falls back to an escape-first
  built-in renderer (also the offline path).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>claude-web</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="app" data-mode="readonly">
    <aside id="sidebar">
      <div class="side-top">
        <div id="brand" class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2z"/>
          </svg>
          <span>claude-web</span>
        </div>
        <button id="collapse-btn" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button id="new-chat" class="new-chat">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>New chat</span>
      </button>
      <nav id="session-list" aria-label="Chat history"></nav>
      <div class="side-bottom">
        <div id="cli-status" class="cli-status"></div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="expand-btn" class="icon-btn hidden" title="Show sidebar" aria-label="Show sidebar">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="top-spacer"></div>
        <label class="model-wrap" for="model-select">
          <select id="model-select" title="Model"></select>
        </label>
        <button id="mode-pill" class="mode-pill readonly" title="Toggle full access">
          <span class="mode-dot"></span><span id="mode-label">Read-only</span>
        </button>
      </header>

      <div id="scroll" class="scroll">
        <section id="greeting" class="greeting">
          <h1 id="greeting-text">Good evening</h1>
        </section>
        <div id="banner" class="banner hidden"></div>
        <section id="chat" class="chat"></section>
        <div id="load-earlier-wrap" class="load-earlier-wrap hidden">
          <button id="load-earlier" class="load-earlier">Load earlier messages…</button>
        </div>
      </div>

      <div class="composer-wrap">
        <div id="scroll-bottom-btn-wrap" class="scroll-bottom-wrap hidden">
          <button id="scroll-bottom-btn" class="scroll-bottom-btn" title="Jump to latest" aria-label="Jump to latest">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <form id="composer" class="composer">
          <textarea id="input" rows="1" placeholder="Reply to Claude…" autocomplete="off"></textarea>
          <button id="send-btn" type="submit" class="send-btn" aria-label="Send">
            <svg id="send-icon" viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg id="stop-icon" viewBox="0 0 24 24" width="18" height="18" class="hidden"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
          </button>
        </form>
        <div class="composer-hint">claude-web runs the local Claude Code CLI · <span id="cwd-hint"></span></div>
      </div>
    </main>
  </div>

  <dialog id="confirm-full-access">
    <h2>Enable full access?</h2>
    <p>
      Claude will be able to run commands and edit files on this machine
      without asking. Only enable this for prompts you trust.
    </p>
    <div class="dialog-actions">
      <button id="confirm-cancel" class="btn-secondary" type="button">Cancel</button>
      <button id="confirm-ok" class="btn-danger" type="button">Enable full access</button>
    </div>
  </dialog>

  <script src="/vendor/marked.umd.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
